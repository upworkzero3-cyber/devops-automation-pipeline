<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Pipeline - Multi-Tier App</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .status {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .status-card {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }
        .status-label {
            color: #666;
            font-size: 12px;
            text-transform: uppercase;
        }
        .status-value {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-top: 5px;
        }
        .users-section {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .users-section h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 10px;
            margin-bottom: 20px;
        }
        input {
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-family: inherit;
        }
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #764ba2;
        }
        .users-list {
            margin-top: 20px;
        }
        .user-item {
            background: #f9f9f9;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 5px;
            border-left: 3px solid #667eea;
        }
        .loading {
            color: #666;
            font-style: italic;
        }
        .error {
            color: #d32f2f;
            padding: 10px;
            background: #ffebee;
            border-radius: 5px;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 DevOps Pipeline Multi-Tier App</h1>
            <p>Advanced CI/CD with Disaster Recovery</p>
            
            <div class="status">
                <div class="status-card">
                    <div class="status-label">API Status</div>
                    <div class="status-value" id="apiStatus">Checking...</div>
                </div>
                <div class="status-card">
                    <div class="status-label">Database Status</div>
                    <div class="status-value" id="dbStatus">Checking...</div>
                </div>
                <div class="status-card">
                    <div class="status-label">Deployment</div>
                    <div class="status-value" id="deployStatus">Kubernetes</div>
                </div>
            </div>
        </div>

        <div class="users-section">
            <h2>User Management</h2>
            
            <div id="error" class="error" style="display: none;"></div>
            
            <div class="form-group">
                <input type="text" id="name" placeholder="Enter name" />
                <input type="email" id="email" placeholder="Enter email" />
                <button onclick="addUser()">Add User</button>
            </div>

            <div class="users-list">
                <h3>Users:</h3>
                <div id="usersList" class="loading">Loading users...</div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = '/api';

        // Check API and Database health
        async function checkHealth() {
            try {
                const apiRes = await fetch(`${API_URL}/health`);
                document.getElementById('apiStatus').textContent = apiRes.ok ? '✅ Healthy' : '❌ Down';
            } catch {
                document.getElementById('apiStatus').textContent = '❌ Unreachable';
            }

            try {
                const dbRes = await fetch(`${API_URL}/db-health`);
                document.getElementById('dbStatus').textContent = dbRes.ok ? '✅ Connected' : '❌ Failed';
            } catch {
                document.getElementById('dbStatus').textContent = '❌ Unreachable';
            }
        }

        // Load users
        async function loadUsers() {
            try {
                const res = await fetch(`${API_URL}/users`);
                const users = await res.json();
                
                if (users.length === 0) {
                    document.getElementById('usersList').innerHTML = '<p class="loading">No users yet</p>';
                } else {
                    document.getElementById('usersList').innerHTML = users.map(u => 
                        `<div class="user-item"><strong>${u.name}</strong> - ${u.email}</div>`
                    ).join('');
                }
            } catch (err) {
                document.getElementById('usersList').innerHTML = '<p class="error">Failed to load users</p>';
            }
        }

        // Add user
        async function addUser() {
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const errorDiv = document.getElementById('error');

            if (!name || !email) {
                errorDiv.textContent = 'Please fill in all fields';
                errorDiv.style.display = 'block';
                return;
            }

            try {
                const res = await fetch(`${API_URL}/users`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email })
                });

                if (res.ok) {
                    document.getElementById('name').value = '';
                    document.getElementById('email').value = '';
                    errorDiv.style.display = 'none';
                    loadUsers();
                } else {
                    throw new Error('Failed to add user');
                }
            } catch (err) {
                errorDiv.textContent = err.message;
                errorDiv.style.display = 'block';
            }
        }

        // Initial load
        checkHealth();
        loadUsers();
        setInterval(checkHealth, 30000); // Check every 30 seconds
        setInterval(loadUsers, 10000);   // Refresh users every 10 seconds
    </script>
</body>
</html>
